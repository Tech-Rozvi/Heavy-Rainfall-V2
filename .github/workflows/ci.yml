name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests
        run: python -m pytest tests/ -q --tb=short
      - name: Version identity
        run: |
          python -c "from src.rozvi import __version__, __platform_name__; assert __platform_name__=='ROZVI'; print('ROZVI', __version__)"
          python -c "from src.eprf import __version__; print('EPRF', __version__)"
